name: Delete retired public AI Model NewAPI package
on:
  workflow_dispatch:
    inputs:
      confirm_package:
        description: Exact retired package name
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  delete-retired:
    if: github.repository == 'nickhelion/new-api' && inputs.confirm_package == 'nickhelion/aimodel-newapi'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only the retired public package and verify absence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = 'https://api.github.com/users/nickhelion/packages/container/aimodel-newapi'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'AIModel-Retired-Package-Cleanup'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  package = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print('retired package already absent')
                  raise SystemExit(0)
              raise
          assert package['visibility'] == 'public', 'refuse unexpected private package'
          assert package['name'] == 'aimodel-newapi'
          assert package['repository']['full_name'] == 'nickhelion/new-api'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method='DELETE'), timeout=20) as response:
              assert response.status == 204
          try:
              urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20)
          except urllib.error.HTTPError as error:
              assert error.code == 404
              print('deleted retired public package; verified HTTP 404')
          else:
              raise RuntimeError('package still present after delete')
          PY
